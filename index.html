<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="hello-kitty.png" type="image/x-icon">
    <title>Calculadora</title>
</head>
<body>
    <div id="calculadora">
        <div id="laco">
        <img id="lac" src="laço.png" alt="laço">
        </div>

        <div id="visor">
            <p id="escrito"></p>
        </div>
        <div id="num">
            <button type="button" id="limp">c</button>

            <button type="button" id="um">1</button>
            <button type="button" id="dois">2</button>
            <button type="button" id="tres">3</button>
            <button type="button" id="quatro">4</button>
            <button type="button" id="cinco">5</button>
            <button type="button" id="seis">6</button>
            <button type="button" id="sete">7</button>
            <button type="button" id="oito">8</button>
            <button type="button" id="nove">9</button>
            <button type="button" id="zero">0</button>

            <button type="button" id="adc">+</button>
            <button type="button" id="sub">-</button>
            <button type="button" id="mult">x</button>
            <button type="button" id="div">÷</button>

            <button type="button" id="igual">=</button>


        </div>

    </div>
</body>
<script src="script.js"></script>
</html>
